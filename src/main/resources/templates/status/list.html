<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 신청현황 | HT AX 해커톤</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260611-schedule-date-fit')}">
    <link rel="icon" type="image/png" th:href="@{/images/Logo.png}">
</head>
<body class="workspace-page status-list-page">
<main class="page-shell status-shell status-list-shell">
    <header class="page-header status-list-header">
        <img class="status-list-logo" th:src="@{/images/landing-v2/logo.png}" alt="해태">
        <div>
            <span class="eyebrow">HT AX HACKATHON</span>
            <h1>내 신청현황</h1>
            <p th:text="'총 ' + ${#lists.size(applications)} + '건의 신청 내역이 있습니다.'">총 1건의 신청 내역이 있습니다.</p>
        </div>
    </header>

    <section class="card detail-card status-item" th:each="item, stat : ${applications}">
        <span class="status-item-index" th:text="${#numbers.formatInteger(stat.count, 2)}">01</span>
        <div class="detail-title">
            <div>
                <h2 th:text="${item.teamName}">팀명</h2>
            </div>
            <span class="badge" th:classappend="${'badge-' + item.status.name().toLowerCase()}"
                  th:text="${item.status.label}">접수</span>
        </div>
        <dl class="detail-grid">
            <div><dt>분류</dt><dd th:text="${item.category?.label ?: '-'}">분류</dd></div>
            <div><dt>주제</dt><dd th:text="${item.topic}">주제</dd></div>
            <div><dt>신청일시</dt><dd th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}">일시</dd></div>
        </dl>
        <div class="status-message status-message-approved" th:if="${item.status.name() == 'APPROVED'}">
            <span class="status-pill"><span class="status-pill-icon">✓</span>승인</span>
            <strong>참가 신청이 승인되었습니다.</strong>
            <span>자세한 일정은 담당자가 별도로 안내드릴 예정입니다.</span>
        </div>
        <div class="status-message status-message-rejected" th:if="${item.status.name() == 'REJECTED'}">
            <span class="status-pill"><span class="status-pill-icon">×</span>반려</span>
            <span>이번 신청은 반려되었습니다. 아이디어를 보완해 다시 도전해 보세요.</span>
            <a class="button button-primary button-small status-reapply" th:href="@{/apply}">다시 신청하기</a>
        </div>
        <div class="status-message status-message-pending"
             th:if="${item.status.name() != 'APPROVED' and item.status.name() != 'REJECTED'}">
            <span class="status-pill"><span class="status-pill-icon status-pill-icon-clock"></span>접수</span>
            <strong>신청이 접수되어 검토 중입니다.</strong>
            <span>결과가 확정되면 이곳에서 확인하실 수 있습니다.</span>
        </div>
    </section>

    <div class="form-actions status-actions">
        <a class="button button-ghost" th:href="@{/}">처음으로</a>
    </div>
    <footer class="site-footer">© 2026 HT AX. All rights reserved.</footer>
</main>
</body>
</html>
