<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신청 수정 | HT AX 해커톤</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260611-schedule-date-fit')}">
    <link rel="icon" type="image/png" th:href="@{/images/Logo.png}">
</head>
<body class="workspace-page">
<main class="page-shell form-shell">
    <header class="page-header">
        <span class="eyebrow">신청 수정</span>
        <h1>신청서 수정</h1>
        <p>신청 정보와 팀원을 수정하고 필요한 첨부파일을 추가합니다.</p>
    </header>
    <form class="card form-card" th:action="@{/admin/applications/{id}/edit(id=${applicationId})}"
          th:object="${applicationForm}" method="post" enctype="multipart/form-data">
        <div class="global-errors" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">오류 메시지</p>
        </div>
        <section class="form-section">
            <div class="section-heading"><span>01</span><div><h2>팀 정보</h2><p>팀명과 대표 전화번호를 수정할 수 있습니다. 비밀번호는 변경되지 않습니다.</p></div></div>
            <label class="field"><span>팀명 <b>*</b></span><input type="text" th:field="*{teamName}"><small class="field-error" th:errors="*{teamName}"></small></label>
            <label class="field"><span>대표 전화번호 <b>*</b></span><input type="tel" th:field="*{representativePhone}" inputmode="tel" maxlength="20"><small class="field-error" th:errors="*{representativePhone}"></small></label>
        </section>
        <section class="form-section">
            <div class="section-heading section-heading-action">
                <div class="heading-copy"><span>02</span><div><h2>구성인원</h2><p>사번은 숫자 7자리로 입력해 주세요.</p></div></div>
                <button class="button button-secondary button-small" id="add-member" type="button">+ 구성원 추가</button>
            </div>
            <p class="field-error" th:errors="*{members}"></p>
            <div class="member-list" id="member-list">
                <div class="member-row" th:each="member, stat : *{members}">
                    <div class="member-row-header"><strong>팀원 <span class="member-number" th:text="${stat.count}">1</span></strong><button class="text-button remove-member" type="button">삭제</button></div>
                    <div class="member-fields">
                        <label class="field"><span>소속 <b>*</b></span><input type="text" th:field="*{members[__${stat.index}__].department}"><small class="field-error" th:errors="*{members[__${stat.index}__].department}"></small></label>
                        <label class="field"><span>사번 <b>*</b></span><input type="text" th:field="*{members[__${stat.index}__].employeeNo}" inputmode="numeric" maxlength="7" pattern="\d{7}"><small class="field-error" th:errors="*{members[__${stat.index}__].employeeNo}"></small></label>
                        <label class="field"><span>이름 <b>*</b></span><input type="text" th:field="*{members[__${stat.index}__].name}"><small class="field-error" th:errors="*{members[__${stat.index}__].name}"></small></label>
                    </div>
                </div>
            </div>
        </section>
        <section class="form-section">
            <div class="section-heading"><span>03</span><div><h2>아이디어</h2><p>주제와 내용을 수정할 수 있습니다.</p></div></div>
            <div class="field"><span>분류 <b>*</b></span>
                <div class="category-options">
                    <label class="category-chip" th:each="cat : ${categories}">
                        <input type="radio" th:field="*{category}" th:value="${cat}">
                        <span th:text="${cat.label}">기타</span>
                    </label>
                </div>
                <small class="field-error" th:errors="*{category}"></small>
            </div>
            <label class="field"><span>주제 <b>*</b></span><input type="text" th:field="*{topic}"><small class="field-error" th:errors="*{topic}"></small></label>
            <label class="field"><span>내용 <b>*</b></span><textarea th:field="*{content}" rows="8"></textarea><small class="field-error" th:errors="*{content}"></small></label>
        </section>
        <section class="form-section">
            <div class="section-heading"><span>04</span><div><h2>첨부파일</h2><p>기존 파일을 삭제하거나 새 파일을 추가할 수 있습니다.</p></div></div>
            <div class="existing-files" th:if="${!#lists.isEmpty(existingFiles)}">
                <div class="existing-file-item" th:each="file : ${existingFiles}">
                    <a class="file-link" th:href="@{/admin/applications/{id}/files/{fileId}/download(id=${applicationId},fileId=${file.id})}" th:text="${file.originalFileName}">파일명</a>
                    <button class="text-button" type="submit" formmethod="post" formnovalidate
                            th:formaction="@{/admin/applications/{id}/files/{fileId}/delete(id=${applicationId},fileId=${file.id})}">
                        삭제
                    </button>
                </div>
            </div>
            <label class="file-field"><input type="file" id="attachment-picker"><span class="file-button">파일 추가</span><span class="file-guide" id="file-guide">추가할 파일을 선택해 주세요.</span></label>
            <input class="file-submission-input" type="file" th:field="*{attachments}" multiple>
            <ul class="selected-file-list" id="selected-file-list"></ul>
        </section>
        <div class="form-actions">
            <a class="button button-ghost" th:href="@{/admin/applications/{id}(id=${applicationId})}">취소</a>
            <button class="button button-primary" type="submit">수정 저장</button>
        </div>
    </form>
</main>
<script th:src="@{/js/application-form.js(v='20260611-schedule-date-fit')}"></script>
</body>
</html>
