<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 조회 | HT AX 해커톤</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260615-password-lookup-polish')}">
    <link rel="icon" type="image/png" th:href="@{/images/Logo.png}">
</head>
<body class="workspace-page password-lookup-page">
<main class="page-shell status-shell password-lookup-shell">
    <section class="status-panel password-lookup-panel">
        <header class="page-header">
            <img class="status-panel-logo" th:src="@{/images/landing-v2/logo.png}" alt="해태">
            <span class="eyebrow">관리자</span>
            <div>
                <h1>비밀번호 조회</h1>
                <p>대표 전화번호를 입력하면 등록된 비밀번호를 확인할 수 있습니다.</p>
            </div>
        </header>

        <div class="reset-success" th:if="${foundPassword != null}">
            <strong th:text="${foundPhone}">전화번호</strong> 번호의 비밀번호:
            <span class="found-password" th:text="${foundPassword}">password</span>
        </div>

        <form class="card form-card" th:action="@{/admin/applications/password-lookup}"
              th:object="${passwordLookupForm}" method="post">
            <div class="global-errors" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">오류 메시지</p>
            </div>

            <section class="form-section">
                <label class="field">
                    <span>대표 전화번호 <b>*</b></span>
                    <div class="status-input-wrap">
                        <span class="status-input-icon status-input-icon-phone" aria-hidden="true"></span>
                        <input type="tel" th:field="*{representativePhone}" placeholder="예: 010-1234-5678" inputmode="tel" maxlength="20">
                    </div>
                    <small class="field-error" th:errors="*{representativePhone}"></small>
                </label>
            </section>

            <div class="form-actions">
                <a class="button button-ghost" th:href="@{/admin/applications}">목록으로</a>
                <button class="button button-primary" type="submit">조회</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
