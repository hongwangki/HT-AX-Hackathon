<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신청 상세 | HT AX 해커톤</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="page-shell admin-shell">
    <header class="page-header">
        <span class="eyebrow">APPLICATION DETAIL</span>
        <h1 th:text="${hackathonApplication.teamName}">팀명</h1>
        <p>참가 신청 상세 내용을 확인합니다.</p>
    </header>
    <section class="card detail-card">
        <div class="detail-title"><h2>신청 정보</h2><span class="badge" th:classappend="${'badge-' + hackathonApplication.status.name().toLowerCase()}" th:text="${hackathonApplication.status}">SUBMITTED</span></div>
        <dl class="detail-grid">
            <div><dt>팀명</dt><dd th:text="${hackathonApplication.teamName}">팀명</dd></div>
            <div><dt>신청일시</dt><dd th:text="${#temporals.format(hackathonApplication.createdAt, 'yyyy-MM-dd HH:mm')}">일시</dd></div>
            <div class="detail-full"><dt>주제</dt><dd th:text="${hackathonApplication.topic}">주제</dd></div>
            <div class="detail-full"><dt>내용</dt><dd class="pre-line" th:text="${hackathonApplication.content}">내용</dd></div>
        </dl>
    </section>
    <section class="card detail-card">
        <h2>구성인원 <small th:text="${#lists.size(hackathonApplication.members)} + '명'">1명</small></h2>
        <div class="table-wrap">
            <table><thead><tr><th>소속</th><th>사번</th><th>이름</th></tr></thead>
            <tbody><tr th:each="member : ${hackathonApplication.members}"><td th:text="${member.department}">소속</td><td th:text="${member.employeeNo}">사번</td><td th:text="${member.name}">이름</td></tr></tbody></table>
        </div>
    </section>
    <section class="card detail-card">
        <h2>첨부파일 <small th:text="${#lists.size(hackathonApplication.files)} + '개'">0개</small></h2>
        <div class="table-wrap">
            <table><thead><tr><th>원본 파일명</th><th>파일 크기</th><th>Content Type</th></tr></thead>
            <tbody>
            <tr th:each="file : ${hackathonApplication.files}"><td><a class="file-link" th:href="@{/admin/applications/{id}/files/{fileId}/download(id=${hackathonApplication.id},fileId=${file.id})}" th:text="${file.originalFileName}">파일명</a></td><td th:text="${#numbers.formatInteger(file.fileSize, 1, 'COMMA')} + ' bytes'">0 bytes</td><td th:text="${file.contentType ?: '-'}">-</td></tr>
            <tr th:if="${#lists.isEmpty(hackathonApplication.files)}"><td class="empty-cell" colspan="3">첨부파일이 없습니다.</td></tr>
            </tbody></table>
        </div>
    </section>
    <div class="detail-actions">
        <a class="button button-secondary" th:href="@{/admin/applications}">목록으로 돌아가기</a>
        <a class="button button-primary" th:href="@{/admin/applications/{id}/edit(id=${hackathonApplication.id})}">수정</a>
        <a class="button button-danger" th:href="@{/admin/applications/{id}/delete(id=${hackathonApplication.id})}">삭제</a>
    </div>
</main>
</body>
</html>
