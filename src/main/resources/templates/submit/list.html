<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과제 제출 | HT AX 해커톤</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260805-submission-deadline')}">
    <link rel="icon" type="image/png" th:href="@{/images/Logo.png}">
</head>
<body class="workspace-page status-list-page">
<main class="page-shell status-shell status-list-shell">
    <header class="page-header status-list-header">
        <img class="status-list-logo" th:src="@{/images/landing-v2/logo.png}" alt="해태">
        <div>
            <span class="eyebrow">HT AX HACKATHON</span>
            <h1>과제 제출</h1>
            <p th:text="'승인된 신청 ' + ${#lists.size(applications)} + '건 중 제출할 과제를 선택해 주세요.'">승인된 신청 1건 중 제출할 과제를 선택해 주세요.</p>
        </div>
    </header>

    <section class="card detail-card status-item status-item-approved" th:each="item, stat : ${applications}">
        <span class="status-item-index" th:text="${#numbers.formatInteger(stat.count, 2)}">01</span>
        <div class="detail-title">
            <div>
                <h2 th:text="${item.teamName}">팀명</h2>
            </div>
        </div>
        <dl class="detail-grid">
            <div><dt>분류</dt><dd th:text="${item.category?.label ?: '-'}">분류</dd></div>
            <div><dt>주제</dt><dd th:text="${item.topic}">주제</dd></div>
            <div><dt>신청일시</dt><dd th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}">일시</dd></div>
        </dl>
        <div class="status-message status-message-approved"
             th:with="itemSubmission=${submissionsByApplicationId[item.id]}">
            <span class="status-pill"><span class="status-pill-icon">✓</span>승인</span>
            <strong th:if="${submissionOpen} and ${itemSubmission == null}">과제 제출이 가능합니다.</strong>
            <strong th:if="${!submissionOpen} and ${itemSubmission == null}">과제 제출이 마감되었습니다.</strong>
            <strong th:unless="${itemSubmission == null}">과제가 제출되었습니다.</strong>
            <span th:if="${submissionOpen} and ${itemSubmission == null}">8월 5일 23:59까지 심사할 자료를 제출해 주세요.</span>
            <span th:if="${submissionOpen} and ${itemSubmission != null}"
                  th:text="'최종 제출 ' + ${#temporals.format(itemSubmission.updatedAt, 'yyyy-MM-dd HH:mm')} + ' · 마감 전까지 수정할 수 있습니다.'">최종 제출 일시</span>
            <span th:unless="${submissionOpen}">과제 제출이 마감되었습니다.</span>
            <form th:action="@{/submit}" method="post">
                <input type="hidden" name="applicationId" th:value="${item.id}">
                <input type="hidden" name="representativePhone" th:value="${statusCheckForm.representativePhone}">
                <input type="hidden" name="password" th:value="${statusCheckForm.password}">
                <button class="button button-primary" type="submit" th:disabled="${!submissionOpen}"
                        th:text="${itemSubmission == null} ? '과제 제출하기' : '제출 확인 · 수정'">과제 제출하기</button>
            </form>
        </div>
    </section>

    <div class="form-actions status-actions">
        <a class="button button-ghost" th:href="@{/}">처음으로</a>
    </div>
    <footer class="site-footer">© 2026 HT AX. All rights reserved.</footer>
</main>
</body>
</html>
