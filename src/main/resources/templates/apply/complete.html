<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접수 완료 | 해태제과 사내 AI 경연대회</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260604-1')}">
    <link rel="icon" type="image/png" th:href="@{/images/Logo.png}">
</head>
<body class="success-page">
<main class="success-shell">
    <section class="event-stage" aria-label="해태제과 사내 AI 경연대회 참가 신청 완료">
        <div class="event-dots event-dots-left"></div>
        <div class="event-waves"></div>
        <div class="event-sparkles"></div>
        <div class="event-bubbles"></div>
        <div class="event-swoosh"></div>
        <div class="event-card success-event-card">
            <p class="event-badge"><span>제1회</span> HT AX HACKATHON</p>
            <div class="success-mark">✓</div>
            <p class="success-label">접수 완료</p>
            <h1 class="success-heading">참가 신청이 완료되었습니다.</h1>
            <p class="event-description">참가 신청이 정상적으로 접수되었습니다.<br>제출해주신 내용은 담당자가 확인 후 안내드릴 예정입니다.</p>
            <a class="event-button" th:href="@{/}">메인으로 돌아가기</a>
            <div class="event-dots card-dots"></div>
        </div>
        <img class="product-image product-ace" th:src="@{/images/ace.png}" alt="">
        <img class="product-image product-homerun" th:src="@{/images/homerun.png}" alt="">
        <img class="product-image product-oyes" th:src="@{/images/oyes.png}" alt="">
    </section>
</main>
</body>
</html>
