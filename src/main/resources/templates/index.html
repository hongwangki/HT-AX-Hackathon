<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해태제과 사내 AI 경연대회</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260604-1')}">
    <link rel="icon" type="image/png" th:href="@{/images/Logo.png}">
</head>
<body class="landing-page">
<main class="landing-shell">
    <section class="event-stage" aria-label="제1회 해태제과 사내 AI 경연대회">
        <div class="event-dots event-dots-left"></div>
        <div class="event-waves"></div>
        <div class="event-sparkles"></div>
        <div class="event-bubbles"></div>
        <div class="event-swoosh"></div>
        <div class="event-card landing-event-card">
            <p class="event-badge"><span>제1회</span> HT AX HACKATHON</p>
            <p class="event-subtitle event-brand">해태제과</p>
            <h1 class="event-main-title">사내 AI 경연대회</h1>
            <div class="event-divider"><span>✦</span></div>
            <p class="event-description">우리 일의 불편함을 AI로 바꾸는 시간<br>작은 아이디어가 더 나은 업무가 됩니다.</p>
            <p class="ai-made-note">이 페이지는 AI를 활용해 제작되었습니다.</p>
            <a class="event-button" th:href="@{/apply}">참가 접수</a>
            <div class="event-dots card-dots"></div>
        </div>
        <img class="product-image product-ace" th:src="@{/images/ace.png}" alt="">
        <img class="product-image product-homerun" th:src="@{/images/homerun.png}" alt="">
        <img class="product-image product-oyes" th:src="@{/images/oyes.png}" alt="">
    </section>
</main>
</body>
</html>
